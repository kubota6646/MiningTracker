# MiningTracker 設定ファイル

# データベース設定
database:
  # データベースタイプ (sqlite または mysql)
  type: sqlite
  
  # SQLiteの設定
  sqlite:
    # SQLiteのファイル名
    file: mining_data.db
  
  # MySQLの設定
  mysql:
    # MySQLサーバーのホスト
    host: localhost
    # MySQLサーバーのポート
    port: 3306
    # データベース名
    database: minecraft
    # ユーザー名
    username: root
    # パスワード
    password: password
    # 接続プール設定
    pool:
      # 最大接続数
      maximum-pool-size: 10
      # 最小アイドル接続数
      minimum-idle: 2
      # 接続タイムアウト（ミリ秒）
      connection-timeout: 30000

# 採掘カウント設定
tracking:
  # 採掘をカウントするか
  enabled: true
  # クリエイティブモードでの採掘をカウントするか
  count-creative: false
  # シルクタッチで採掘したブロックをカウントするか
  count-silk-touch: true

# ランキング設定
ranking:
  # 1ページあたりの表示件数
  per-page: 10
  # 採掘数0のプレイヤーを表示するか
  show-zero: false

# メッセージ設定
messages:
  # メッセージファイルを使用するか
  use-message-file: true
  # メッセージファイルの言語 (ja, en)
  language: ja
