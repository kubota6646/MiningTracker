# MiningTracker 設定ファイル

# データベース設定
database:
  # データベースタイプ (sqlite または yaml)
  type: sqlite
  # SQLiteのファイル名
  file: mining_data.db

# 採掘カウント設定
tracking:
  # 採掘をカウントするか
  enabled: true
  # クリエイティブモードでの採掘をカウントするか
  count-creative: false
  # シルクタッチで採掘したブロックをカウントするか
  count-silk-touch: true

# ランキング設定
ranking:
  # 1ページあたりの表示件数
  per-page: 10
  # 採掘数0のプレイヤーを表示するか
  show-zero: false

# メッセージ設定
messages:
  # メッセージファイルを使用するか
  use-message-file: true
  # メッセージファイルの言語 (ja, en)
  language: ja
